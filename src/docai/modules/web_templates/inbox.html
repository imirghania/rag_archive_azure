{% extends "base.html" %}{% block body %}
<div class="card"><h1>Inbox</h1>
{% for m in messages %}<form method="post" action="/inbox/{{ m.id }}/read" class="card"><input type="hidden" name="csrf" value="{{ csrf }}">
  <strong>{{ m.title }}</strong>{% if not m.read_at %} <span class="ok">new</span>{% endif %}<p class="muted" dir="auto">{{ m.body }}</p>{% if not m.read_at %}<button class="secondary">Mark read</button>{% endif %}</form>
{% else %}<p class="muted">No messages.</p>{% endfor %}</div>{% endblock %}
