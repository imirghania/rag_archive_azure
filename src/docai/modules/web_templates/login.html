{% extends "base.html" %}{% block body %}
<div class="card"><h1>Sign in</h1>
{% if dev_users %}<p class="muted">Local development: choose a test user.</p>
<div class="row">{% for u in dev_users %}<a href="/dev-login?user={{ u }}"><button type="button">{{ u }}</button></a>{% endfor %}</div>
{% else %}<p><a href="/auth/login"><button type="button">Sign in with Microsoft</button></a></p>{% endif %}
</div>{% endblock %}
