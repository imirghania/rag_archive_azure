[project]
name = "docai"
version = "0.1.0"
description = "Grounded document assistant: OCR, review and cited answers over scanned archives on Azure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "numpy>=2.0",
    "pypdfium2>=4.30",
    "pyarrow>=17.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy>=2",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.2",
]

[project.scripts]
docai-run = "docai.app.entrypoint:run"

[project.optional-dependencies]
samples = ["python-docx>=1.1"]
azure = [
    "azure-identity>=1.17",
    "azure-servicebus>=7.12",
    "azure-storage-blob>=12.22",
    "azure-storage-file-datalake>=12.16",
    "azure-search-documents>=11.6",
    "azure-ai-contentsafety>=1.0",
    "openai>=1.40",
    "azure-ai-projects>=2.0",
    "azure-ai-documentintelligence>=1.0",
    "msal>=1.30",
    "azure-keyvault-secrets>=4.8",
    "azure-monitor-opentelemetry>=1.6",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "tests"]  # the deploy package, and conftest helpers for tests in subfolders

[tool.ruff]
line-length = 100
src = ["src", "tests"]
